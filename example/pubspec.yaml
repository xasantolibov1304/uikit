name: uikit_example
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  auto_route: ^10.1.0+1

  # UIKit
  iman_uikit:
    path: ../

  device_preview: ^1.3.1
  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  import_sorter: ^4.6.0

  flutter_launcher_icons: ^0.14.3

  # Code generation
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.10.0
  auto_route_generator: ^10.2.3

flutter_gen:
  output: lib/gen
  integrations:
    flutter_svg: true
    lottie: true
  assets:
    enabled: true
    outputs:
      class_name: Assets

flutter:
  uses-material-design: true
